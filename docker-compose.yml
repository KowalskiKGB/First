name: first

services:
  media:
    image: alpine:3.22
    restart: "no"
    volumes:
      - first-media:/out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        MEDIA_SHA=7455efae41b330c265e7cd4b78dfa848e7ce5ebd
        MEDIA_NAMES_SHA=73c038588404c71dd441535ce7a955d4d087575634d87712dbdbbe0f569ff000
        MEDIA_CONTENT_SHA=84a9a354242923378e9e7dfca3026277a01a1a9fb8de57f7d2a5021d55fc215b
        jpg_count=0
        gif_count=0
        names_sha=
        content_sha=
        if [ -d /out/img ]; then jpg_count=$$(find /out/img -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' '); fi
        if [ -d /out/gif ]; then gif_count=$$(find /out/gif -maxdepth 1 -type f -name '*.gif' | wc -l | tr -d ' '); fi
        if [ -d /out/img ] && [ -d /out/gif ]; then names_sha=$$(cd /out && find img gif -type f | sort | sha256sum | awk '{print $$1}'); fi
        if [ "$$names_sha" = "$$MEDIA_NAMES_SHA" ]; then content_sha=$$(cd /out && find img gif -type f | sort | while IFS= read -r f; do sha256sum "$$f"; done | sha256sum | awk '{print $$1}'); fi
        if [ "$$(cat /out/.source-commit 2>/dev/null || true)" = "$$MEDIA_SHA" ] && [ "$$jpg_count" = 1324 ] && [ "$$gif_count" = 1324 ] && [ "$$names_sha" = "$$MEDIA_NAMES_SHA" ] && [ "$$content_sha" = "$$MEDIA_CONTENT_SHA" ]; then
          echo "Exercise media already matches $$MEDIA_SHA"
          exit 0
        fi
        work=/tmp/first-exercise-media
        stage=/out/.staging-media
        rm -rf "$$work" "$$stage"
        mkdir -p "$$work" "$$stage/img" "$$stage/gif"
        wget -qO "$$work/source.tar.gz" "https://github.com/hasaneyldrm/exercises-dataset/archive/$$MEDIA_SHA.tar.gz"
        tar -xzf "$$work/source.tar.gz" -C "$$work"
        cp "$$work/exercises-dataset-$$MEDIA_SHA/images/"*.jpg "$$stage/img/"
        cp "$$work/exercises-dataset-$$MEDIA_SHA/videos/"*.gif "$$stage/gif/"
        test "$$(find "$$stage/img" -maxdepth 1 -type f -name '*.jpg' | wc -l | tr -d ' ')" = 1324
        test "$$(find "$$stage/gif" -maxdepth 1 -type f -name '*.gif' | wc -l | tr -d ' ')" = 1324
        test "$$(cd "$$stage" && find img gif -type f | sort | sha256sum | awk '{print $$1}')" = "$$MEDIA_NAMES_SHA"
        test "$$(cd "$$stage" && find img gif -type f | sort | while IFS= read -r f; do sha256sum "$$f"; done | sha256sum | awk '{print $$1}')" = "$$MEDIA_CONTENT_SHA"
        rm -rf /out/img /out/gif
        mv "$$stage/img" /out/img
        mv "$$stage/gif" /out/gif
        printf '%s' "$$MEDIA_SHA" > /out/.source-commit
        rm -rf "$$work" "$$stage"
        echo "Installed 1,324 images and 1,324 GIFs from $$MEDIA_SHA"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      RP_ID: ${RP_ID:?RP_ID must match the public hostname}
      ORIGIN: ${ORIGIN:?ORIGIN must be the public HTTPS URL}
      RP_NAME: ${RP_NAME:-First}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      INVITE_ONLY: ${INVITE_ONLY:?INVITE_ONLY must be explicitly 0 or 1}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://example.invalid}
      DEV_PANEL_USER: ${DEV_PANEL_USER:?DEV_PANEL_USER must begin with first_dev_}
      DEV_PANEL_PASSWORD_HASH: ${DEV_PANEL_PASSWORD_HASH:?DEV_PANEL_PASSWORD_HASH must be an scrypt hash}
      # Optional: the core health endpoint works without AI; provider operations fail closed.
      AI_CONFIG_MASTER_KEY: ${AI_CONFIG_MASTER_KEY:-}
    volumes:
      - first-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_EXERCISE_MEDIA: "1"
        VITE_IMG_BASE: media/img/
        VITE_GIF_BASE: media/gif/
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      media:
        condition: service_completed_successfully
    expose:
      - "80"
    volumes:
      - first-media:/usr/share/nginx/html/media:ro
    # The media router always requires Basic Auth because the visual files are licensed
    # separately. The same credential can temporarily guard the whole host during bootstrap.
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.first-bootstrap-auth.basicauth.users=${FIRST_BASIC_AUTH_USERS:?FIRST_BASIC_AUTH_USERS is required to protect exercise media}"
      # Android must fetch Digital Asset Links without credentials to verify passkeys.
      - "traefik.http.routers.first-assetlinks-${COOLIFY_RESOURCE_UUID:-first}.entrypoints=https"
      - "traefik.http.routers.first-assetlinks-${COOLIFY_RESOURCE_UUID:-first}.rule=Host(`first.rocketxsistemas.com.br`) && Path(`/.well-known/assetlinks.json`)"
      - "traefik.http.routers.first-assetlinks-${COOLIFY_RESOURCE_UUID:-first}.priority=1200"
      - "traefik.http.routers.first-assetlinks-${COOLIFY_RESOURCE_UUID:-first}.middlewares=gzip"
      - "traefik.http.routers.first-assetlinks-${COOLIFY_RESOURCE_UUID:-first}.tls=true"
      - "traefik.http.routers.first-assetlinks-${COOLIFY_RESOURCE_UUID:-first}.service=first-secure-${COOLIFY_RESOURCE_UUID:-first}"
      - "traefik.http.routers.first-media-${COOLIFY_RESOURCE_UUID:-first}.entrypoints=https"
      - "traefik.http.routers.first-media-${COOLIFY_RESOURCE_UUID:-first}.rule=Host(`first.rocketxsistemas.com.br`) && PathPrefix(`/media/`)"
      - "traefik.http.routers.first-media-${COOLIFY_RESOURCE_UUID:-first}.priority=1100"
      - "traefik.http.routers.first-media-${COOLIFY_RESOURCE_UUID:-first}.middlewares=gzip,first-bootstrap-auth"
      - "traefik.http.routers.first-media-${COOLIFY_RESOURCE_UUID:-first}.tls=true"
      - "traefik.http.routers.first-media-${COOLIFY_RESOURCE_UUID:-first}.service=first-secure-${COOLIFY_RESOURCE_UUID:-first}"
      - "traefik.http.routers.first-secure-${COOLIFY_RESOURCE_UUID:-first}.entrypoints=https"
      - "traefik.http.routers.first-secure-${COOLIFY_RESOURCE_UUID:-first}.rule=Host(`first.rocketxsistemas.com.br`)"
      - "traefik.http.routers.first-secure-${COOLIFY_RESOURCE_UUID:-first}.priority=1000"
      - "traefik.http.routers.first-secure-${COOLIFY_RESOURCE_UUID:-first}.middlewares=gzip${FIRST_BOOTSTRAP_MIDDLEWARE:-}"
      - "traefik.http.routers.first-secure-${COOLIFY_RESOURCE_UUID:-first}.tls=true"
      - "traefik.http.routers.first-secure-${COOLIFY_RESOURCE_UUID:-first}.service=first-secure-${COOLIFY_RESOURCE_UUID:-first}"
      - "traefik.http.services.first-secure-${COOLIFY_RESOURCE_UUID:-first}.loadbalancer.server.port=80"

volumes:
  first-data:
  first-media:
