name: first

services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      RP_ID: ${RP_ID:?RP_ID must match the public hostname}
      ORIGIN: ${ORIGIN:?ORIGIN must be the public HTTPS URL}
      RP_NAME: ${RP_NAME:-First}
      ADMIN_UIDS: ${ADMIN_UIDS:-}
      INVITE_ONLY: ${INVITE_ONLY:-0}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://example.invalid}
    volumes:
      - first-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

volumes:
  first-data:
